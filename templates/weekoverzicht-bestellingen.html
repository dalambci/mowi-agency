<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <!-- Redirect stub. /templates/weekoverzicht-bestellingen was a generated workflow template
       page (build-templates.js) until 2026-10-19, when the Mowi Dashboard
       kept seven workflows and removed the other seventeen, this one among
       them (Sal: "only real effective workflows"; vault: Mowi - Decisions
       log, 2026-10-19). The generator only writes pages for templates in
       content/templates/templates.json, so it never touches this file;
       without it the old URL would keep serving the last generated page.

       Client-side redirect, NOT a real 301 (a static host can't issue one
       from a file); rel="canonical" carries the signal for search engines.
       noindex keeps the stub itself out of search results. -->
  <meta name="robots" content="noindex, follow" />
  <meta http-equiv="refresh" content="0; url=/templates" />
  <link rel="canonical" href="https://mowi.agency/templates" />

  <title>Verplaatst naar /templates — Mowi</title>
</head>
<body>
  <p>Deze template bestaat niet meer. Bekijk de templates op <a href="/templates">mowi.agency/templates</a>.</p>

  <!-- replace(), not href: keeps the dead URL out of the back-button history,
       so "terug" from /templates doesn't bounce the visitor straight back
       here and into a redirect loop. -->
  <script>window.location.replace("/templates");</script>
</body>
</html>
