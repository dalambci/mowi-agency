<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <!-- Redirect stub. /workflows was the rebranded overview page from Stage 7
       (2026-08-17) until 2026-09-08, when Sal retired it: "workflows and
       dashboards should link to their respective page on the templates page.
       oh and remove the page they currently link to."

       It had already stopped being what its name promised. By the end it held
       exactly one section — Dashboards — while every link into its workflow
       half (#order-status, #offerte-opvolging, #agenda-samenvatting,
       #crm-sync, #factuurverwerking, #lead-verrijking, #rapportgenerator)
       pointed at anchors that no longer existed, from 33-34 pages each. The
       Templates marketplace covers all of it now, filtered per kind, with a
       real page per template instead of an anchor on a shared page.

       Kept as a stub rather than deleted outright, matching the convention
       the other eight retired URLs on this site already follow: the page had
       88 inbound links and an unknown number of external ones, and a deleted
       file 404s all of them. This is a client-side redirect, NOT a real 301 —
       a static host can't issue one from a file. If the old URL turns out to
       matter for SEO, add a proper 301 as a Cloudways Web Rule (app
       mowi.agency / 6590002 -> Web Rules -> Redirect, ^/workflows$ ->
       /templates) and delete this file.

       noindex keeps this stub itself out of search results — without it the
       stub can rank in place of the real page. -->
  <meta name="robots" content="noindex, follow" />
  <meta http-equiv="refresh" content="0; url=/templates" />
  <link rel="canonical" href="https://mowi.agency/templates" />

  <title>Verplaatst naar /templates — Mowi</title>
</head>
<body>
  <p>Deze pagina is verhuisd naar <a href="/templates">mowi.agency/templates</a>.</p>

  <!-- replace(), not href: keeps the dead URL out of the back-button history,
       so "terug" from /templates doesn't bounce the visitor straight back here
       and into a redirect loop. -->
  <script>window.location.replace("/templates");</script>
</body>
</html>
