<!DOCTYPE html>
<!--
  Mowi — Open Graph card source (Stage 7 of the rebrand, 2026-08-17)
  =====================================================================
  Dev-only reference file — same status as chrome-snippet.html and the
  other files in reference/. Not shipped, nothing links here.

  This is the SOURCE for assets/og-image.png. It is screenshotted at
  exactly 1200x630 (the standard Open Graph card size) with Playwright —
  see the one-off screenshot command in the Stage 7 work log / PUBLISHING
  notes. If the design ever needs to change, edit this file and re-run:

    node -e "
      const { chromium } = require('playwright');
      (async () => {
        const browser = await chromium.launch();
        const page = await browser.newPage({ viewport: { width: 1200, height: 630 } });
        await page.goto('file://' + __dirname + '/reference/og-card.html');
        await page.screenshot({ path: 'assets/og-image.png' });
        await browser.close();
      })();
    "

  Design: warm bone canvas + ink text + one Mowi-orange accent shape, same
  token values as css/style.css's :root (--bg, --ink, --ink-muted, --accent,
  --font-sans, --font-serif-emph) — hand-copied here rather than linking
  css/style.css, since this page is deliberately a standalone, minimal
  artifact independent of the live site's stylesheet. Headline copy reuses
  the exact pre-footer CTA line already live on every rebranded page
  ("Uw bedrijf op de automatische piloot.") rather than inventing new
  marketing copy for this one asset.
-->
<html lang="nl">
<head>
<meta charset="UTF-8" />
<title>Mowi OG card</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700;800&family=Instrument+Serif:ital@1&display=swap" rel="stylesheet" />
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  html, body {
    width: 1200px;
    height: 630px;
    overflow: hidden;
    background: #faf6ef;
    font-family: "Plus Jakarta Sans", ui-sans-serif, system-ui, -apple-system, sans-serif;
  }

  .card {
    position: relative;
    width: 1200px;
    height: 630px;
    background: #faf6ef;
  }

  /* Decorative accent ring — echoes the site's own "orb" icon mark
     (assets/icon-192.png), redrawn here as a plain CSS ring so it stays
     crisp at any zoom and doesn't depend on the PNG's alpha channel. */
  .ring {
    position: absolute;
    top: -180px;
    right: -180px;
    width: 620px;
    height: 620px;
    border-radius: 50%;
    border: 90px solid #e8590c;
    opacity: 0.14;
  }
  .ring-small {
    position: absolute;
    bottom: -140px;
    right: 140px;
    width: 260px;
    height: 260px;
    border-radius: 50%;
    border: 40px solid #e8590c;
    opacity: 0.1;
  }

  .content {
    position: relative;
    height: 100%;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    padding: 72px 88px;
  }

  .brand {
    display: flex;
    align-items: center;
    gap: 18px;
  }
  .brand img.icon {
    height: 46px;
    width: auto;
    display: block;
  }
  .brand img.wordmark {
    height: 38px;
    width: auto;
    display: block;
  }

  .headline {
    max-width: 860px;
    color: #1c1712;
    font-weight: 800;
    font-size: 64px;
    line-height: 1.08;
    letter-spacing: -0.01em;
  }
  .headline em {
    font-family: "Instrument Serif", Georgia, "Times New Roman", serif;
    font-style: italic;
    font-weight: 400;
    color: #e8590c;
  }

  .foot {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    color: #6b5f50;
    font-size: 22px;
    font-weight: 600;
  }
  .foot .url {
    color: #e8590c;
    font-weight: 700;
  }
</style>
</head>
<body>
  <div class="card">
    <div class="ring"></div>
    <div class="ring-small"></div>
    <div class="content">
      <div class="brand">
        <img class="icon" src="../assets/mowi-icon.png" alt="" />
        <img class="wordmark" src="../assets/mowi-wordmark.png" alt="Mowi" />
      </div>

      <h1 class="headline">Uw bedrijf op de <em>automatische&nbsp;piloot.</em></h1>

      <div class="foot">
        <span>AI-automatisering voor het Nederlandse MKB</span>
        <span class="url">mowi.agency</span>
      </div>
    </div>
  </div>
</body>
</html>
