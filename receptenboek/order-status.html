<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <!-- Redirect stub. /receptenboek/order-status was a live, publicly-deployed
       Receptenboek recipe detail page until the Stage 8 rebuild cleanup on
       2026-08-17, when the gallery was retired as standalone pages — this
       recipe's content now lives as a full panel at /workflows#order-status.
       Root-relative target below (not "../workflows...") since this file
       lives one level down in receptenboek/ but the refresh/replace target
       and canonical must resolve from the site root, exactly like the
       sibling stubs at the site root. Without this file the old URL 404s
       for anyone who bookmarked it, and for every external link and search
       result still pointing at it.

       This is a client-side redirect, NOT a real 301 — a static host can't
       issue one from a file. It works for humans immediately; search engines
       treat it as a weaker signal than a server 301, which is what
       rel="canonical" below is for. If the old URL turns out to matter for
       SEO, add a proper 301 as a Cloudways Web Rule (app mowi.agency /
       6590002 -> Web Rules -> Redirect, ^/receptenboek/order-status$ ->
       /workflows#order-status) and delete this file.

       noindex keeps this stub itself out of search results — without it the
       stub can rank in place of the real page. -->
  <meta name="robots" content="noindex, follow" />
  <meta http-equiv="refresh" content="0; url=/workflows#order-status" />
  <link rel="canonical" href="https://mowi.agency/workflows#order-status" />

  <title>Verplaatst naar /workflows#order-status — Mowi</title>
</head>
<body>
  <p>Deze pagina is verhuisd naar <a href="/workflows#order-status">mowi.agency/workflows#order-status</a>.</p>

  <!-- replace(), not href: keeps the dead URL out of the back-button history,
       so "terug" from /workflows#order-status doesn't bounce the visitor straight back here
       and into a redirect loop. -->
  <script>window.location.replace("/workflows#order-status");</script>
</body>
</html>
