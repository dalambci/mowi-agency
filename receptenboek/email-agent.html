<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <!-- Redirect stub. /receptenboek/email-agent was a live, publicly-deployed
       Receptenboek recipe detail page until the Stage 8 rebuild cleanup on
       2026-08-17, when it became a stub pointing at /workflows#email-agent.
       Retargeted again 2026-08-28: that anchor was never real content (the
       gallery panel was folded into workflows.html on paper but the page
       stayed chrome-only), so this now points at the real /e-mail-agent
       landing page. Root-relative target below (not "../e-mail-agent")
       since this file lives one level down in receptenboek/ but the
       refresh/replace target and canonical must resolve from the site
       root, exactly like the sibling stubs at the site root. Without this
       file the old URL 404s for anyone who bookmarked it, and for every
       external link and search result still pointing at it.

       This is a client-side redirect, NOT a real 301 — a static host can't
       issue one from a file. It works for humans immediately; search engines
       treat it as a weaker signal than a server 301, which is what
       rel="canonical" below is for. If the old URL turns out to matter for
       SEO, add a proper 301 as a Cloudways Web Rule (app mowi.agency /
       6590002 -> Web Rules -> Redirect, ^/receptenboek/email-agent$ ->
       /e-mail-agent) and delete this file.

       noindex keeps this stub itself out of search results — without it the
       stub can rank in place of the real page. -->
  <meta name="robots" content="noindex, follow" />
  <meta http-equiv="refresh" content="0; url=/e-mail-agent" />
  <link rel="canonical" href="https://mowi.agency/e-mail-agent" />

  <title>Verplaatst naar /e-mail-agent — Mowi</title>
</head>
<body>
  <p>Deze pagina is verhuisd naar <a href="/e-mail-agent">mowi.agency/e-mail-agent</a>.</p>

  <!-- replace(), not href: keeps the dead URL out of the back-button history,
       so "terug" from /e-mail-agent doesn't bounce the visitor straight back here
       and into a redirect loop. -->
  <script>window.location.replace("/e-mail-agent");</script>
</body>
</html>
