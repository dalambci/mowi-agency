<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <!-- Redirect stub. /vertrouwen was the blank-skeleton URL of the site's
       security/trust page until 2026-08-22, when it was renamed to /security
       to match the label the footer has always used for this link ("Security",
       not "Vertrouwen") — the URL and the visible label had drifted apart
       since the shapes-skeleton rebuild remapped chrome to Dutch. Same
       client-side-redirect pattern as /tarieven: not a real 301 (a static
       host can't issue one from a file), rel="canonical" carries the SEO
       signal instead. If the old URL turns out to matter for SEO, add a
       proper 301 as a Cloudways Web Rule (app mowi.agency / 6590002 ->
       Web Rules -> Redirect, ^/vertrouwen$ -> /security) and delete this file.

       noindex keeps this stub itself out of search results — without it the
       stub can rank in place of the real page. -->
  <meta name="robots" content="noindex, follow" />
  <meta http-equiv="refresh" content="0; url=/security" />
  <link rel="canonical" href="https://mowi.agency/security" />

  <title>Verplaatst naar /security — Mowi</title>
</head>
<body>
  <p>Deze pagina is verhuisd naar <a href="/security">mowi.agency/security</a>.</p>

  <!-- replace(), not href: keeps the dead URL out of the back-button history,
       so "terug" from /security doesn't bounce the visitor straight back here
       and into a redirect loop. -->
  <script>window.location.replace("/security");</script>
</body>
</html>
