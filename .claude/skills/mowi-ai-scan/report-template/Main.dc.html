  <style>
    :root{
      --bg:#faf8f4; --card:#ffffff; --ink:#1f2420; --muted:#6b7269;
      --border:#e2e6e0; --accent:#2f6f5c; --accent-light:#e6f0ec; --accent-dark:#1c3f34;
    }
    *{box-sizing:border-box;}
    body{margin:0;font-family:'Public Sans',system-ui,sans-serif;color:var(--ink);}
    h1,h2{font-family:'Newsreader',Georgia,serif;margin:0;}
    em.accent{font-style:italic;color:#cfe6db;}
    a{color:var(--accent);} a:hover{color:var(--accent-dark);}
  </style>

<div style="width:1200px;height:750px;background:var(--accent-dark);position:relative;overflow:hidden;display:flex;flex-direction:column;padding:56px 64px;color:#f4f2ea;">

  <div aria-hidden="true" style="position:absolute;top:-120px;right:-120px;width:420px;height:420px;border-radius:50%;background:radial-gradient(circle, rgba(255,255,255,0.06) 0%, rgba(255,255,255,0.06) 30%, transparent 31%), radial-gradient(circle, rgba(255,255,255,0.05) 0%, rgba(255,255,255,0.05) 45%, transparent 46%);"></div>

  <div style="display:flex;justify-content:space-between;align-items:center;">
    <div style="font-family:'Newsreader',Georgia,serif;font-weight:600;font-size:22px;letter-spacing:0.3px;">Mowi</div>
    <div style="font-size:13px;color:#cfe6db;">01 · Titelslide</div>
  </div>

  <div style="flex-grow:1;display:flex;flex-direction:column;justify-content:center;gap:20px;max-width:820px;">
    <h1 style="font-size:56px;font-weight:600;line-height:1.1;">AI-<em class="accent">scan</em></h1>
    <div style="font-size:26px;font-weight:500;color:#f4f2ea;">Rapport voor [Bedrijfsnaam]</div>
    <div style="font-size:16px;color:#cfe6db;max-width:520px;line-height:1.5;">Een overzicht van waar u tijd wint, met concrete tools die daar vandaag al voor bestaan.</div>
  </div>

  <div style="display:grid;grid-template-columns:repeat(3, minmax(0, 1fr));gap:16px;">
    <div style="background:rgba(255,255,255,0.08);border-radius:12px;padding:16px 18px;">
      <div style="font-size:12px;color:#a9c9be;margin-bottom:6px;">Datum</div>
      <div style="font-size:15px;font-weight:500;">[DD maand JJJJ]</div>
    </div>
    <div style="background:rgba(255,255,255,0.08);border-radius:12px;padding:16px 18px;">
      <div style="font-size:12px;color:#a9c9be;margin-bottom:6px;">Type bedrijf</div>
      <div style="font-size:15px;font-weight:500;">Webshop / e-commerce</div>
    </div>
    <div style="background:rgba(255,255,255,0.08);border-radius:12px;padding:16px 18px;">
      <div style="font-size:12px;color:#a9c9be;margin-bottom:6px;">Primaire focus</div>
      <div style="font-size:15px;font-weight:500;">Efficiëntie</div>
    </div>
  </div>

  <div style="margin-top:24px;font-size:13px;color:#a9c9be;">Opgesteld door Sal van Mowi</div>
</div>
