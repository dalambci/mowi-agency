<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <!-- Redirect stub. /agents/phone-agent was a live, publicly-deployed
       agent detail page until the Stage 7 rebrand cleanup on 2026-08-17,
       when it was replaced by /receptenboek/call-agent, then folded into
       /workflows#call-agent at Stage 8 (also 2026-08-17). Retargeted again
       2026-08-28: /workflows#call-agent was never real content (the anchor
       didn't exist — workflows.html was chrome-only), so this now points
       straight at the real /call-agent landing page, the first actual page
       either agent has ever had. Root-relative target below (not
       "../call-agent") since this file lives one level down in agents/ but
       the refresh/replace target and canonical must resolve from the site
       root, exactly like the sibling stubs at the site root. Without this
       file the old URL 404s for anyone who bookmarked it, and for every
       external link and search result still pointing at it.

       This is a client-side redirect, NOT a real 301 — a static host can't
       issue one from a file. It works for humans immediately; search engines
       treat it as a weaker signal than a server 301, which is what
       rel="canonical" below is for. If the old URL turns out to matter for
       SEO, add a proper 301 as a Cloudways Web Rule (app mowi.agency /
       6590002 -> Web Rules -> Redirect, ^/agents/phone-agent$ ->
       /call-agent) and delete this file.

       noindex keeps this stub itself out of search results — without it the
       stub can rank in place of the real page. -->
  <meta name="robots" content="noindex, follow" />
  <meta http-equiv="refresh" content="0; url=/call-agent" />
  <link rel="canonical" href="https://mowi.agency/call-agent" />

  <title>Verplaatst naar /call-agent — Mowi</title>
</head>
<body>
  <p>Deze pagina is verhuisd naar <a href="/call-agent">mowi.agency/call-agent</a>.</p>

  <!-- replace(), not href: keeps the dead URL out of the back-button history,
       so "terug" from /call-agent doesn't bounce the visitor straight back here
       and into a redirect loop. -->
  <script>window.location.replace("/call-agent");</script>
</body>
</html>
